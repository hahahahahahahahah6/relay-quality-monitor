[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-quality-monitor"
version = "0.1.0"
description = "Live relay capability monitoring against a trusted baseline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
relay-quality-monitor = "relay_quality_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
